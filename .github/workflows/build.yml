name: Build Hermes v0.21.5 security image

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hermes-v0215-security-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKER_BUILD_RECORD_UPLOAD: false
  IMAGE_NAME: ghcr.io/wmorin/hermes-v0215-security-image
  PACKAGE_NAME: hermes-v0215-security-image
  IMAGE_VERSION: v0.21.5-security.1
  UPSTREAM_SOURCE: https://github.com/NousResearch/hermes-agent
  UPSTREAM_REVISION: f97608f178d1ffeca59860195ab7da295f7c8e5f
  SECURITY_PATCH_SHA256: 70727d75c2c2bf99f8e9d16c98f095a5b28bdc589356463e6eddac6a5ad7eacf

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out public build policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: build-policy
          persist-credentials: false

      - name: Check out exact Hermes release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: NousResearch/hermes-agent
          ref: f97608f178d1ffeca59860195ab7da295f7c8e5f
          path: hermes-agent
          fetch-depth: 1
          persist-credentials: false

      - name: Materialize and verify the narrow security patch
        working-directory: hermes-agent
        run: ../build-policy/prepare-source.sh

      - name: Audit deployed dependency scopes
        working-directory: hermes-agent
        run: |
          npm audit --workspaces=false --audit-level=moderate
          npm audit --workspace web --audit-level=moderate
          npm audit --workspace ui-tui --audit-level=moderate

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build exact linux/amd64 image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: hermes-agent
          file: hermes-agent/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: hermes-v0215-security:test
          build-args: |
            HERMES_GIT_SHA=${{ env.UPSTREAM_REVISION }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.IMAGE_VERSION }}
            io.wmorin.hermes.builder-repository=https://github.com/wmorin/hermes-v021-security-image
            io.wmorin.hermes.upstream-source=${{ env.UPSTREAM_SOURCE }}
            io.wmorin.hermes.upstream-revision=${{ env.UPSTREAM_REVISION }}
            io.wmorin.hermes.security-patch-sha256=${{ env.SECURITY_PATCH_SHA256 }}
          cache-from: type=gha,scope=hermes-v0215-security-amd64
          cache-to: type=gha,mode=max,scope=hermes-v0215-security-amd64

      - name: Smoke-test image identity and patched packages
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /opt/hermes/.venv/bin/hermes \
            hermes-v0215-security:test --version | grep -F 'Hermes Agent v0.21.5 (2026.9.24)'
          docker run --rm --entrypoint sh hermes-v0215-security:test -c \
            'cd /opt/hermes && npm ls vitest@4.1.11 @vitest/mocker@4.1.11 --all'
          docker run --rm --entrypoint /opt/hermes/.venv/bin/python hermes-v0215-security:test -c \
            'import importlib.metadata as m; expected={"anyio":"4.14.2","httpcore2":"2.12.0","httpx2":"2.12.0"}; actual={name:m.version(name) for name in expected}; print(actual); assert actual == expected'
          test "$(docker image inspect hermes-v0215-security:test --format '{{index .Config.Labels "io.wmorin.hermes.builder-repository"}}')" = 'https://github.com/wmorin/hermes-v021-security-image'
          test "$(docker image inspect hermes-v0215-security:test --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "${GITHUB_SHA}"
          test "$(docker image inspect hermes-v0215-security:test --format '{{index .Config.Labels "io.wmorin.hermes.upstream-source"}}')" = "${UPSTREAM_SOURCE}"
          test "$(docker image inspect hermes-v0215-security:test --format '{{index .Config.Labels "io.wmorin.hermes.upstream-revision"}}')" = "${UPSTREAM_REVISION}"
          test "$(docker image inspect hermes-v0215-security:test --format '{{index .Config.Labels "io.wmorin.hermes.security-patch-sha256"}}')" = "${SECURITY_PATCH_SHA256}"

      - name: Reject fixable HIGH or CRITICAL findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hermes-v0215-security:test
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out public build policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: build-policy
          persist-credentials: false

      - name: Check out exact Hermes release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: NousResearch/hermes-agent
          ref: f97608f178d1ffeca59860195ab7da295f7c8e5f
          path: hermes-agent
          fetch-depth: 1
          persist-credentials: false

      - name: Materialize and verify the narrow security patch
        working-directory: hermes-agent
        run: ../build-policy/prepare-source.sh

      - name: Audit deployed dependency scopes
        working-directory: hermes-agent
        run: |
          npm audit --workspaces=false --audit-level=moderate
          npm audit --workspace web --audit-level=moderate
          npm audit --workspace ui-tui --audit-level=moderate

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: |
            provenance-add-gha=false

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Require a pre-created private destination package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          package_visibility="$(
            gh api "/users/wmorin/packages/container/${PACKAGE_NAME}" \
              --jq .visibility
          )"
          test "${package_visibility}" = private

      - name: Build and publish private final-package linux/amd64 candidate
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: hermes-agent
          file: hermes-agent/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:build-${{ github.sha }}
          build-args: |
            HERMES_GIT_SHA=${{ env.UPSTREAM_REVISION }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.IMAGE_VERSION }}
            io.wmorin.hermes.builder-repository=https://github.com/wmorin/hermes-v021-security-image
            io.wmorin.hermes.upstream-source=${{ env.UPSTREAM_SOURCE }}
            io.wmorin.hermes.upstream-revision=${{ env.UPSTREAM_REVISION }}
            io.wmorin.hermes.security-patch-sha256=${{ env.SECURITY_PATCH_SHA256 }}
          cache-from: type=gha,scope=hermes-v0215-security-amd64
          cache-to: type=gha,mode=max,scope=hermes-v0215-security-amd64
          provenance: mode=max
          sbom: true

      - name: Prove the published digest remains private
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          package_visibility="$(gh api "/users/wmorin/packages/container/${PACKAGE_NAME}" --jq .visibility)"
          test "${package_visibility}" = private

          anonymous_token="$(
            curl --fail --silent --show-error \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:wmorin/${PACKAGE_NAME}:pull" \
              | jq -er .token
          )"
          manifest_status="$(
            curl --silent --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              -H "Authorization: Bearer ${anonymous_token}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json' \
              "https://ghcr.io/v2/wmorin/${PACKAGE_NAME}/manifests/${PUBLISHED_DIGEST}"
          )"
          case "${manifest_status}" in
            401|403) ;;
            *)
              echo "Anonymous manifest request returned HTTP ${manifest_status}, expected 401 or 403" >&2
              exit 1
              ;;
          esac
          if test "$(gh api "/users/wmorin/packages/container/${PACKAGE_NAME}" --jq .visibility)" != private; then
            echo 'Package visibility changed during the anonymous-pull check' >&2
            exit 1
          fi
          printf 'package_visibility=private anonymous_manifest_status=%s\n' "${manifest_status}"

      - name: Verify the exact published digest
        env:
          PUBLISHED_IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "${PUBLISHED_IMAGE}"
          docker run --rm --entrypoint /opt/hermes/.venv/bin/hermes \
            "${PUBLISHED_IMAGE}" --version | grep -F 'Hermes Agent v0.21.5 (2026.9.24)'
          docker run --rm --entrypoint sh "${PUBLISHED_IMAGE}" -c \
            'cd /opt/hermes && npm ls vitest@4.1.11 @vitest/mocker@4.1.11 --all'
          docker run --rm --entrypoint /opt/hermes/.venv/bin/python "${PUBLISHED_IMAGE}" -c \
            'import importlib.metadata as m; expected={"anyio":"4.14.2","httpcore2":"2.12.0","httpx2":"2.12.0"}; actual={name:m.version(name) for name in expected}; print(actual); assert actual == expected'
          test "$(docker image inspect "${PUBLISHED_IMAGE}" --format '{{index .Config.Labels "io.wmorin.hermes.builder-repository"}}')" = 'https://github.com/wmorin/hermes-v021-security-image'
          test "$(docker image inspect "${PUBLISHED_IMAGE}" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "${GITHUB_SHA}"
          test "$(docker image inspect "${PUBLISHED_IMAGE}" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "${IMAGE_VERSION}"
          test "$(docker image inspect "${PUBLISHED_IMAGE}" --format '{{index .Config.Labels "io.wmorin.hermes.upstream-source"}}')" = "${UPSTREAM_SOURCE}"
          test "$(docker image inspect "${PUBLISHED_IMAGE}" --format '{{index .Config.Labels "io.wmorin.hermes.upstream-revision"}}')" = "${UPSTREAM_REVISION}"
          test "$(docker image inspect "${PUBLISHED_IMAGE}" --format '{{index .Config.Labels "io.wmorin.hermes.security-patch-sha256"}}')" = "${SECURITY_PATCH_SHA256}"

      - name: Reject fixable HIGH or CRITICAL findings in published digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Verify provenance and SBOM
        env:
          PUBLISHED_IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          provenance_file="$(mktemp)"
          sbom_file="$(mktemp)"
          email_file="$(mktemp)"
          index_file="$(mktemp)"
          attestation_file="$(mktemp)"
          statement_file="$(mktemp)"
          credentials_file="$(mktemp)"
          header_file="$(mktemp)"
          trap 'unlink "${provenance_file}" "${sbom_file}" "${email_file}" "${index_file}" "${attestation_file}" "${statement_file}" "${credentials_file}" "${header_file}" 2>/dev/null || true' EXIT

          docker buildx imagetools inspect "${PUBLISHED_IMAGE}" \
            --format '{{json .Provenance}}' >"${provenance_file}"
          docker buildx imagetools inspect "${PUBLISHED_IMAGE}" \
            --format '{{json .SBOM}}' >"${sbom_file}"

          jq -e . "${provenance_file}" >/dev/null
          jq -e . "${sbom_file}" >/dev/null
          if grep -qi 'github_event_payload' "${provenance_file}"; then
            echo 'Unexpected event payload in minimal provenance' >&2
            exit 1
          fi
          if grep -qF '/Users/' "${provenance_file}" "${sbom_file}"; then
            echo 'Local path in public attestation' >&2
            exit 1
          fi
          grep -Eio '[[:alnum:]._%+-]+@[[:alnum:].-]+\.[[:alpha:]]{2,}' \
            "${provenance_file}" | sort -u >"${email_file}" || true
          if grep -qv '^git@github\.com$' "${email_file}"; then
            echo 'Unexpected email address in public provenance' >&2
            exit 1
          fi
          jq -e \
            --arg builder_prefix 'https://github.com/wmorin/hermes-v021-security-image/actions/runs/' \
            --arg source "${UPSTREAM_SOURCE}" \
            --arg revision "${UPSTREAM_REVISION}" \
            '
              .SLSA.runDetails.builder.id | startswith($builder_prefix)
            ' "${provenance_file}" >/dev/null
          jq -e \
            --arg source "${UPSTREAM_SOURCE}" \
            --arg revision "${UPSTREAM_REVISION}" \
            '
              .SLSA.buildDefinition.externalParameters.request.root.request.args
              | .["vcs:source"] == $source and .["vcs:revision"] == $revision
            ' "${provenance_file}" >/dev/null

          docker buildx imagetools inspect "${PUBLISHED_IMAGE}" --raw >"${index_file}"
          platform_digest="$(jq -er '.manifests[] | select(
            .platform.os == "linux" and .platform.architecture == "amd64"
          ) | .digest' "${index_file}")"
          attestation_digest="$(jq -er \
            --arg platform_digest "${platform_digest}" \
            '.manifests[] | select(
              .annotations["vnd.docker.reference.type"] == "attestation-manifest" and
              .annotations["vnd.docker.reference.digest"] == $platform_digest
            ) | .digest' "${index_file}")"
          docker buildx imagetools inspect \
            "${IMAGE_NAME}@${attestation_digest}" --raw >"${attestation_file}"
          provenance_digest="$(jq -er '.layers[] | select(
            .annotations["in-toto.io/predicate-type"] == "https://slsa.dev/provenance/v1"
          ) | .digest' "${attestation_file}")"

          chmod 600 "${credentials_file}"
          printf 'machine ghcr.io\nlogin %s\npassword %s\n' \
            "${GITHUB_ACTOR}" "${GITHUB_TOKEN}" >"${credentials_file}"
          registry_token="$(
            curl --fail --silent --show-error --netrc-file "${credentials_file}" \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:wmorin/${PACKAGE_NAME}:pull" \
              | jq -er .token
          )"
          chmod 600 "${header_file}"
          printf 'Authorization: Bearer %s\n' "${registry_token}" >"${header_file}"
          curl --fail --silent --show-error \
            -H "@${header_file}" \
            "https://ghcr.io/v2/wmorin/${PACKAGE_NAME}/blobs/${provenance_digest}" \
            >"${statement_file}"
          jq -e \
            --arg subject_name "pkg:docker/${IMAGE_NAME}@build-${GITHUB_SHA}?platform=linux%2Famd64" \
            --arg subject_digest "${platform_digest#sha256:}" \
            '
              .subject == [{
                name: $subject_name,
                digest: {sha256: $subject_digest}
              }]
            ' "${statement_file}" >/dev/null
          jq -e '[.. | objects | select(
            .name? == "vitest" and .versionInfo? == "4.1.11"
          )] | length > 0' "${sbom_file}" >/dev/null
          jq -e '[.. | objects | select(
            .name? == "@vitest/mocker" and .versionInfo? == "4.1.11"
          )] | length > 0' "${sbom_file}" >/dev/null
          for package_spec in anyio:4.14.2 h2:4.4.1 hpack:4.2.0 httpcore2:2.12.0 httpx2:2.12.0; do
            package_name="${package_spec%%:*}"
            package_version="${package_spec#*:}"
            jq -e --arg name "${package_name}" --arg version "${package_version}" \
              '[.. | objects | select(.name? == $name and .versionInfo? == $version)] | length > 0' \
              "${sbom_file}" >/dev/null
          done

      - name: Remove the unverified bootstrap placeholder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t bootstrap_version_ids < <(
            gh api --paginate \
              "/users/wmorin/packages/container/${PACKAGE_NAME}/versions?per_page=100" \
              --jq '.[] | select((.metadata.container.tags // []) | index("bootstrap")) | .id'
          )
          if test "${#bootstrap_version_ids[@]}" -ne 1; then
            echo "Expected exactly one bootstrap package version, found ${#bootstrap_version_ids[@]}" >&2
            exit 1
          fi
          gh api --method DELETE \
            "/users/wmorin/packages/container/${PACKAGE_NAME}/versions/${bootstrap_version_ids[0]}"
          if gh api --paginate \
              "/users/wmorin/packages/container/${PACKAGE_NAME}/versions?per_page=100" \
              --jq '.[] | select((.metadata.container.tags // []) | index("bootstrap")) | .id' \
              | grep -q .; then
            echo 'Bootstrap package version still exists after deletion' >&2
            exit 1
          fi
          test "$(gh api "/users/wmorin/packages/container/${PACKAGE_NAME}" --jq .visibility)" = private

      - name: Report verified identity
        run: |
          printf 'image=%s@%s\n' "${IMAGE_NAME}" "${{ steps.build.outputs.digest }}"
          printf 'discovery_tag=%s:build-%s\n' "${IMAGE_NAME}" "${GITHUB_SHA}"
          printf 'promotion_url=https://github.com/users/wmorin/packages/container/%s/settings\n' "${PACKAGE_NAME}"
