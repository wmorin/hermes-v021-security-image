name: Build Hermes v0.21.3 security image

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hermes-v0213-security-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKER_BUILD_RECORD_UPLOAD: false
  IMAGE_NAME: ghcr.io/wmorin/hermes-v0213-security-image
  PACKAGE_NAME: hermes-v0213-security-image
  IMAGE_VERSION: v0.21.3-security.1
  UPSTREAM_SOURCE: https://github.com/NousResearch/hermes-agent
  UPSTREAM_REVISION: 345cd2b057a452236de401d3534b8502a7465e8d
  SECURITY_BASELINE_REVISION: 51e2cb22b07f302827fdf3fd82f1d8c710aedfe3
  SECURITY_PATCH_SHA256: 4325356290ac7d4f1062d86facc9b1634e0770270823e89b87dd1863bd2e01cc

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out public build policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: build-policy
          persist-credentials: false

      - name: Check out exact Hermes release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: NousResearch/hermes-agent
          ref: 345cd2b057a452236de401d3534b8502a7465e8d
          path: hermes-agent
          fetch-depth: 1
          persist-credentials: false

      - name: Materialize and verify the narrow security patch
        working-directory: hermes-agent
        run: ../build-policy/prepare-source.sh

      - name: Audit deployed dependency scopes
        working-directory: hermes-agent
        run: |
          npm audit --workspaces=false --audit-level=moderate
          npm audit --workspace web --audit-level=moderate
          npm audit --workspace ui-tui --audit-level=moderate

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build exact linux/amd64 image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: hermes-agent
          file: hermes-agent/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: hermes-v0213-security:test
          build-args: |
            HERMES_GIT_SHA=${{ env.UPSTREAM_REVISION }}
          labels: |
            org.opencontainers.image.source=https://github.com/wmorin/hermes-v021-security-image
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.IMAGE_VERSION }}
            io.wmorin.hermes.upstream-source=${{ env.UPSTREAM_SOURCE }}
            io.wmorin.hermes.upstream-revision=${{ env.UPSTREAM_REVISION }}
            io.wmorin.hermes.security-baseline-revision=${{ env.SECURITY_BASELINE_REVISION }}
            io.wmorin.hermes.security-patch-sha256=${{ env.SECURITY_PATCH_SHA256 }}
          cache-from: type=gha,scope=hermes-v0213-security-amd64
          cache-to: type=gha,mode=max,scope=hermes-v0213-security-amd64

      - name: Smoke-test image identity and patched packages
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /opt/hermes/.venv/bin/hermes \
            hermes-v0213-security:test --version | grep -F 'Hermes Agent v0.21.3 (2026.9.14)'
          docker run --rm --entrypoint sh hermes-v0213-security:test -c \
            'cd /opt/hermes && npm ls browserslist@4.28.8 sanitize-html@2.17.7 vitest@4.1.11 @vitest/mocker@4.1.11 colord@2.9.4 --all'
          test "$(docker image inspect hermes-v0213-security:test --format '{{index .Config.Labels "org.opencontainers.image.source"}}')" = 'https://github.com/wmorin/hermes-v021-security-image'
          test "$(docker image inspect hermes-v0213-security:test --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "${GITHUB_SHA}"
          test "$(docker image inspect hermes-v0213-security:test --format '{{index .Config.Labels "io.wmorin.hermes.upstream-source"}}')" = "${UPSTREAM_SOURCE}"
          test "$(docker image inspect hermes-v0213-security:test --format '{{index .Config.Labels "io.wmorin.hermes.upstream-revision"}}')" = "${UPSTREAM_REVISION}"
          test "$(docker image inspect hermes-v0213-security:test --format '{{index .Config.Labels "io.wmorin.hermes.security-baseline-revision"}}')" = "${SECURITY_BASELINE_REVISION}"
          test "$(docker image inspect hermes-v0213-security:test --format '{{index .Config.Labels "io.wmorin.hermes.security-patch-sha256"}}')" = "${SECURITY_PATCH_SHA256}"

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out public build policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: build-policy
          persist-credentials: false

      - name: Check out exact Hermes release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: NousResearch/hermes-agent
          ref: 345cd2b057a452236de401d3534b8502a7465e8d
          path: hermes-agent
          fetch-depth: 1
          persist-credentials: false

      - name: Materialize and verify the narrow security patch
        working-directory: hermes-agent
        run: ../build-policy/prepare-source.sh

      - name: Audit deployed dependency scopes
        working-directory: hermes-agent
        run: |
          npm audit --workspaces=false --audit-level=moderate
          npm audit --workspace web --audit-level=moderate
          npm audit --workspace ui-tui --audit-level=moderate

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: |
            provenance-add-gha=false

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Refuse to overwrite a public package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api_error_file="$(mktemp)"
          trap 'unlink "${api_error_file}" 2>/dev/null || true' EXIT

          set +e
          package_visibility="$(
            gh api "/users/wmorin/packages/container/${PACKAGE_NAME}" \
              --jq .visibility 2>"${api_error_file}"
          )"
          result_status=$?
          set -e

          if [ "${result_status}" -eq 0 ]; then
            test "${package_visibility}" = private
          elif ! grep -qF '(HTTP 404)' "${api_error_file}"; then
            echo 'Could not prove that the destination package is absent or private' >&2
            exit 1
          fi

      - name: Build and publish private final-package linux/amd64 candidate
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: hermes-agent
          file: hermes-agent/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:build-${{ github.sha }}
          build-args: |
            HERMES_GIT_SHA=${{ env.UPSTREAM_REVISION }}
          labels: |
            org.opencontainers.image.source=https://github.com/wmorin/hermes-v021-security-image
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.IMAGE_VERSION }}
            io.wmorin.hermes.upstream-source=${{ env.UPSTREAM_SOURCE }}
            io.wmorin.hermes.upstream-revision=${{ env.UPSTREAM_REVISION }}
            io.wmorin.hermes.security-baseline-revision=${{ env.SECURITY_BASELINE_REVISION }}
            io.wmorin.hermes.security-patch-sha256=${{ env.SECURITY_PATCH_SHA256 }}
          cache-from: type=gha,scope=hermes-v0213-security-amd64
          cache-to: type=gha,mode=max,scope=hermes-v0213-security-amd64
          provenance: mode=min
          sbom: true

      - name: Verify final package remains private
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "/users/wmorin/packages/container/${PACKAGE_NAME}" --jq .visibility)" = private

      - name: Verify the exact private digest
        env:
          PUBLISHED_IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "${PUBLISHED_IMAGE}"
          docker run --rm --entrypoint /opt/hermes/.venv/bin/hermes \
            "${PUBLISHED_IMAGE}" --version | grep -F 'Hermes Agent v0.21.3 (2026.9.14)'
          docker run --rm --entrypoint sh "${PUBLISHED_IMAGE}" -c \
            'cd /opt/hermes && npm ls browserslist@4.28.8 sanitize-html@2.17.7 vitest@4.1.11 @vitest/mocker@4.1.11 colord@2.9.4 --all'
          test "$(docker image inspect "${PUBLISHED_IMAGE}" --format '{{index .Config.Labels "org.opencontainers.image.source"}}')" = 'https://github.com/wmorin/hermes-v021-security-image'
          test "$(docker image inspect "${PUBLISHED_IMAGE}" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "${GITHUB_SHA}"
          test "$(docker image inspect "${PUBLISHED_IMAGE}" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "${IMAGE_VERSION}"
          test "$(docker image inspect "${PUBLISHED_IMAGE}" --format '{{index .Config.Labels "io.wmorin.hermes.upstream-source"}}')" = "${UPSTREAM_SOURCE}"
          test "$(docker image inspect "${PUBLISHED_IMAGE}" --format '{{index .Config.Labels "io.wmorin.hermes.upstream-revision"}}')" = "${UPSTREAM_REVISION}"
          test "$(docker image inspect "${PUBLISHED_IMAGE}" --format '{{index .Config.Labels "io.wmorin.hermes.security-baseline-revision"}}')" = "${SECURITY_BASELINE_REVISION}"
          test "$(docker image inspect "${PUBLISHED_IMAGE}" --format '{{index .Config.Labels "io.wmorin.hermes.security-patch-sha256"}}')" = "${SECURITY_PATCH_SHA256}"

      - name: Verify minimal provenance and SBOM
        env:
          PUBLISHED_IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          provenance_file="$(mktemp)"
          sbom_file="$(mktemp)"
          email_file="$(mktemp)"
          index_file="$(mktemp)"
          attestation_file="$(mktemp)"
          statement_file="$(mktemp)"
          credentials_file="$(mktemp)"
          header_file="$(mktemp)"
          trap 'unlink "${provenance_file}" "${sbom_file}" "${email_file}" "${index_file}" "${attestation_file}" "${statement_file}" "${credentials_file}" "${header_file}" 2>/dev/null || true' EXIT

          docker buildx imagetools inspect "${PUBLISHED_IMAGE}" \
            --format '{{json .Provenance}}' >"${provenance_file}"
          docker buildx imagetools inspect "${PUBLISHED_IMAGE}" \
            --format '{{json .SBOM}}' >"${sbom_file}"

          jq -e . "${provenance_file}" >/dev/null
          jq -e . "${sbom_file}" >/dev/null
          if grep -qi 'github_event_payload' "${provenance_file}"; then
            echo 'Unexpected event payload in minimal provenance' >&2
            exit 1
          fi
          if grep -qF '/Users/' "${provenance_file}" "${sbom_file}"; then
            echo 'Local path in public attestation' >&2
            exit 1
          fi
          grep -Eio '[[:alnum:]._%+-]+@[[:alnum:].-]+\.[[:alpha:]]{2,}' \
            "${provenance_file}" | sort -u >"${email_file}" || true
          if grep -qv '^git@github\.com$' "${email_file}"; then
            echo 'Unexpected email address in public provenance' >&2
            exit 1
          fi
          jq -e \
            --arg builder_prefix 'https://github.com/wmorin/hermes-v021-security-image/actions/runs/' \
            --arg source "${UPSTREAM_SOURCE}" \
            --arg revision "${UPSTREAM_REVISION}" \
            '
              .SLSA.runDetails.builder.id | startswith($builder_prefix)
            ' "${provenance_file}" >/dev/null
          jq -e \
            --arg source "${UPSTREAM_SOURCE}" \
            --arg revision "${UPSTREAM_REVISION}" \
            '
              .SLSA.buildDefinition.externalParameters.request.root.request.args
              | .["vcs:source"] == $source and .["vcs:revision"] == $revision
            ' "${provenance_file}" >/dev/null

          docker buildx imagetools inspect "${PUBLISHED_IMAGE}" --raw >"${index_file}"
          platform_digest="$(jq -er '.manifests[] | select(
            .platform.os == "linux" and .platform.architecture == "amd64"
          ) | .digest' "${index_file}")"
          attestation_digest="$(jq -er \
            --arg platform_digest "${platform_digest}" \
            '.manifests[] | select(
              .annotations["vnd.docker.reference.type"] == "attestation-manifest" and
              .annotations["vnd.docker.reference.digest"] == $platform_digest
            ) | .digest' "${index_file}")"
          docker buildx imagetools inspect \
            "${IMAGE_NAME}@${attestation_digest}" --raw >"${attestation_file}"
          provenance_digest="$(jq -er '.layers[] | select(
            .annotations["in-toto.io/predicate-type"] == "https://slsa.dev/provenance/v1"
          ) | .digest' "${attestation_file}")"

          chmod 600 "${credentials_file}"
          printf 'machine ghcr.io\nlogin %s\npassword %s\n' \
            "${GITHUB_ACTOR}" "${GITHUB_TOKEN}" >"${credentials_file}"
          registry_token="$(
            curl --fail --silent --show-error --netrc-file "${credentials_file}" \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:wmorin/${PACKAGE_NAME}:pull" \
              | jq -er .token
          )"
          chmod 600 "${header_file}"
          printf 'Authorization: Bearer %s\n' "${registry_token}" >"${header_file}"
          curl --fail --silent --show-error \
            -H "@${header_file}" \
            "https://ghcr.io/v2/wmorin/${PACKAGE_NAME}/blobs/${provenance_digest}" \
            >"${statement_file}"
          jq -e \
            --arg subject_name "pkg:docker/${IMAGE_NAME}@build-${GITHUB_SHA}?platform=linux%2Famd64" \
            --arg subject_digest "${platform_digest#sha256:}" \
            '
              .subject == [{
                name: $subject_name,
                digest: {sha256: $subject_digest}
              }]
            ' "${statement_file}" >/dev/null
          jq -e '[.. | objects | select(
            .name? == "browserslist" and .versionInfo? == "4.28.8"
          )] | length > 0' "${sbom_file}" >/dev/null
          jq -e '[.. | objects | select(
            .name? == "sanitize-html" and .versionInfo? == "2.17.7"
          )] | length > 0' "${sbom_file}" >/dev/null
          jq -e '[.. | objects | select(
            .name? == "vitest" and .versionInfo? == "4.1.11"
          )] | length > 0' "${sbom_file}" >/dev/null
          jq -e '[.. | objects | select(
            .name? == "@vitest/mocker" and .versionInfo? == "4.1.11"
          )] | length > 0' "${sbom_file}" >/dev/null
          jq -e '[.. | objects | select(
            .name? == "colord" and .versionInfo? == "2.9.4"
          )] | length > 0' "${sbom_file}" >/dev/null

      - name: Report verified private identity
        run: |
          printf 'image=%s@%s\n' "${IMAGE_NAME}" "${{ steps.build.outputs.digest }}"
          printf 'discovery_tag=%s:build-%s\n' "${IMAGE_NAME}" "${GITHUB_SHA}"
          printf 'promotion_url=https://github.com/users/wmorin/packages/container/%s/settings\n' "${PACKAGE_NAME}"
